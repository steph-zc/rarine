server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rarine
    username: rarine
    password: rarine
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.hibernate: ERROR
    org.springframework.web: ERROR
    com.rarine: DEBUG
    root: ERROR